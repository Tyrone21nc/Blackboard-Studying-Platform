<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BB Sync</title>
    <style>
        body{
            width: 260px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; margin: 0; background: #f9fafb; color: #111827; }
        h3{
            font-size: 14px; margin-top: 0; color: #4f46e5; }
        button{
            width: 100%; background: #4f46e5; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
        button:hover{
            background: #4338ca; }
        #status{
            margin-top: 10px; font-size: 12px; color: #4b5563; word-break: break-word;
        }
    </style>
</head>
<body>
    <h3>🎓 Blackboard Study Assistant</h3>
    <p style="font-size: 12px; color: #6b7280;">Click below while viewing a Blackboard course page to sync grades and materials.</p>
    <button id="syncBtn">Sync Current Course</button>
    <div id="status"></div>
    <script src="popup.js"></script>
</body>
</html>
